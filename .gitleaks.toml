# gitleaks configuration: the default rules, minus the places where
# secret-looking strings are fixtures.
title = "TAIA"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, examples and the lockfile"
paths = [
  '''(^|/)__tests__/''',
  '''\.test\.(ts|tsx|mjs)$''',
  '''(^|/)e2e/''',
  '''^pnpm-lock\.yaml$''',
  '''^deploy/\.env\.production\.example$''',
]
