# Builds the docs site (apps/docs, Astro Starlight) on PRs that touch it or
# the code its reference pages are generated from, and deploys it to GitHub
# Pages on pushes to main. Pages must be enabled with Source: GitHub Actions.
# Deploy only runs on a public repository, so nothing is published while the
# repo is private.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/adr/**"
      - "apps/mcp/src/tools/**"
      - "apps/web/app/api/**"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/adr/**"
      - "apps/mcp/src/tools/**"
      - "apps/web/app/api/**"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -F @taia/docs typecheck

      - name: Build
        run: pnpm -F @taia/docs build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
