name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for manual reruns)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  REGISTRY: ghcr.io

jobs:
  verify-tag:
    name: Verify tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release tag matches package.json
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid semver release tag (expected vX.Y.Z or vX.Y.Z-prerelease)." >&2
            exit 1
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Tag '$TAG' does not match package.json version '$PACKAGE_VERSION' (expected '$EXPECTED_TAG')." >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  checks:
    name: Build and test release candidate
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Unit tests
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          changelog_header="## [${{ needs.verify-tag.outputs.tag }}]"
          if ! grep -Fq "$changelog_header" CHANGELOG.md; then
            echo "CHANGELOG.md is missing required release header '$changelog_header'." >&2
            exit 1
          fi
          mkdir -p release-assets
          # Section body: everything after the header, up to the next version
          # header or the link reference definitions at the bottom.
          awk -v header="$changelog_header" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            | sed '/./,$!d' > release-assets/release-notes.md
          if ! grep -q '[^[:space:]]' release-assets/release-notes.md; then
            echo "CHANGELOG.md section '$changelog_header' is empty." >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          : > release-assets/checksum-files.txt
          find packages -path "*/src/*" -type f -print | sort >> release-assets/checksum-files.txt
          find packages -path "*/dist/*" -type f -print | sort >> release-assets/checksum-files.txt
          if [[ -d apps/web/.next ]]; then
            find apps/web/.next \
              \( -path "apps/web/.next/cache" -o -path "apps/web/.next/cache/*" -o -path "apps/web/.next/dev" -o -path "apps/web/.next/dev/*" \) -prune \
              -o -type f -print | sort >> release-assets/checksum-files.txt
          fi
          sort -u -o release-assets/checksum-files.txt release-assets/checksum-files.txt
          if [[ ! -s release-assets/checksum-files.txt ]]; then
            echo "No release files found to checksum." >&2
            exit 1
          fi
          while IFS= read -r file; do
            sha256sum "$file"
          done < release-assets/checksum-files.txt > "release-assets/taia-${{ needs.verify-tag.outputs.version }}-SHA256SUMS.txt"

          file_count="$(wc -l < release-assets/checksum-files.txt | tr -d ' ')"
          checksum_count="$(wc -l < "release-assets/taia-${{ needs.verify-tag.outputs.version }}-SHA256SUMS.txt" | tr -d ' ')"
          if [[ "$checksum_count" != "$file_count" ]]; then
            echo "Checksum manifest line count ($checksum_count) does not match release file count ($file_count)." >&2
            exit 1
          fi

          python3 - "release-assets/taia-${{ needs.verify-tag.outputs.version }}-SHA256SUMS.txt" <<'PY'
          import pathlib
          import re
          import sys

          manifest = pathlib.Path(sys.argv[1])
          line_pattern = re.compile(r"^([0-9a-f]{64})  (.+)$")
          seen = set()
          previous_path = None
          for line_number, raw_line in enumerate(manifest.read_text(encoding="utf-8").splitlines(), 1):
              match = line_pattern.match(raw_line)
              if not match:
                  print(f"Malformed checksum manifest line {line_number}: {raw_line}", file=sys.stderr)
                  sys.exit(1)
              path = match.group(2)
              pure_path = pathlib.PurePosixPath(path)
              if path.startswith("/") or "\\" in path or ".." in pure_path.parts:
                  print(f"Unsafe checksum manifest path on line {line_number}: {path}", file=sys.stderr)
                  sys.exit(1)
              if path.startswith("apps/web/.next/cache/") or path == "apps/web/.next/cache" or path.startswith("apps/web/.next/dev/") or path == "apps/web/.next/dev":
                  print(f"Checksum manifest includes transient Next/Turbopack cache path on line {line_number}: {path}", file=sys.stderr)
                  sys.exit(1)
              if path in seen:
                  print(f"Duplicate checksum manifest path on line {line_number}: {path}", file=sys.stderr)
                  sys.exit(1)
              if previous_path is not None and path < previous_path:
                  print(f"Checksum manifest paths are not sorted at line {line_number}: {path} follows {previous_path}", file=sys.stderr)
                  sys.exit(1)
              previous_path = path
              seen.add(path)
          PY

      - name: Upload checksum artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taia-checksums-${{ needs.verify-tag.outputs.version }}
          path: |
            release-assets/taia-${{ needs.verify-tag.outputs.version }}-SHA256SUMS.txt
            release-assets/release-notes.md
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taia-build-${{ needs.verify-tag.outputs.version }}
          path: |
            apps/web/.next
            !apps/web/.next/cache
            !apps/web/.next/dev
            packages/*/dist
          retention-days: 7

  docker:
    name: Build and publish Docker image
    needs: [verify-tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify-tag.outputs.tag }},enable=${{ !contains(needs.verify-tag.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.verify-tag.outputs.version, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM and SLSA provenance to the image, so it can be
          # traced to this commit and workflow run
          # (`docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`).
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: [verify-tag, checks, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download checksum artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: taia-checksums-${{ needs.verify-tag.outputs.version }}
          path: release-assets

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify-tag.outputs.tag }}"
          version="${{ needs.verify-tag.outputs.version }}"
          repo_url="${{ github.server_url }}/${{ github.repository }}"
          checksums_asset="release-assets/taia-${version}-SHA256SUMS.txt"
          checksums_sha256="$(sha256sum "$checksums_asset" | awk '{print $1}')"
          release_commit="$(git rev-parse HEAD)"
          image_name="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            cat release-assets/release-notes.md
            echo
            echo "---"
            echo
            echo "- Commit: ${release_commit}"
            echo "- Docker: \`ghcr.io/${image_name}:${version}\`"
            echo "- Checksums: [taia-${version}-SHA256SUMS.txt](${repo_url}/releases/download/${tag}/taia-${version}-SHA256SUMS.txt) (SHA-256 \`${checksums_sha256}\`)"
            echo "- Full history: [CHANGELOG.md](${repo_url}/blob/${tag}/CHANGELOG.md)"
          } > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          name: TAIA ${{ needs.verify-tag.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.verify-tag.outputs.version, '-') }}
          files: |
            release-assets/taia-${{ needs.verify-tag.outputs.version }}-SHA256SUMS.txt
